[package]
name = "majelinux"
version = "1.0.0"
edition = "2024"
description = "majelinux — native Rust launcher for Majestic RP on Linux (GTK 3, any Proton)"
license = "MIT"
repository = "https://github.com/redyabigboss/majelinux"

[[bin]]
name = "majelinux"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false
overflow-checks = false
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = true
panic = "unwind"
